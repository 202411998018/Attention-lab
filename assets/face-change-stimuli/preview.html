<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>面孔变化检测刺激预览</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#f1eee8;color:#263342;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:26px;margin:0 0 8px}p{color:#66717d;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
figure{margin:0;background:#fff;border:1px solid #ddd8cf;border-radius:14px;padding:12px;box-shadow:0 4px 16px #2633420c}
img{display:block;width:100%;height:auto;border-radius:8px}figcaption{padding:10px 2px 2px;font-weight:650}small{font-weight:400;color:#78818a}
</style></head><body><h1>面孔变化检测刺激 · 10 张 SVG</h1>
<p>每两张为一组，只改变一个面部特征。可用于 flicker 范式原型与预实验。</p>
<div class="grid">
<figure><img src="./01_gaze_left.svg" alt="01_gaze_left.svg"><figcaption>注视方向：向左<br><small>01_gaze_left.svg</small></figcaption></figure>
<figure><img src="./02_gaze_right.svg" alt="02_gaze_right.svg"><figcaption>注视方向：向右<br><small>02_gaze_right.svg</small></figcaption></figure>
<figure><img src="./03_mouth_neutral.svg" alt="03_mouth_neutral.svg"><figcaption>嘴角：中性<br><small>03_mouth_neutral.svg</small></figcaption></figure>
<figure><img src="./04_mouth_smile.svg" alt="04_mouth_smile.svg"><figcaption>嘴角：微笑<br><small>04_mouth_smile.svg</small></figcaption></figure>
<figure><img src="./05_brows_flat.svg" alt="05_brows_flat.svg"><figcaption>眉毛：平直<br><small>05_brows_flat.svg</small></figcaption></figure>
<figure><img src="./06_brows_raised.svg" alt="06_brows_raised.svg"><figcaption>眉毛：上扬<br><small>06_brows_raised.svg</small></figcaption></figure>
<figure><img src="./07_nose_normal.svg" alt="07_nose_normal.svg"><figcaption>鼻子：常规<br><small>07_nose_normal.svg</small></figcaption></figure>
<figure><img src="./08_nose_wide.svg" alt="08_nose_wide.svg"><figcaption>鼻子：较宽<br><small>08_nose_wide.svg</small></figcaption></figure>
<figure><img src="./09_hair_short.svg" alt="09_hair_short.svg"><figcaption>发型：短发<br><small>09_hair_short.svg</small></figcaption></figure>
<figure><img src="./10_hair_bangs.svg" alt="10_hair_bangs.svg"><figcaption>发型：刘海<br><small>10_hair_bangs.svg</small></figcaption></figure>
</div></body></html>
